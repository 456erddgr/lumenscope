<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>LumenScope · 只因君</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0a0c'/%3E%3Cg fill='none' stroke='%232997ff' stroke-width='1.8' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='5.2'/%3E%3Cpath d='M15 15l4 4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
<div class="shell" id="shell">

  <!-- 顶栏：macOS 式（Electron 下为原生交通灯让位） -->
  <header class="topbar" id="topbar">
    <div class="win-controls" id="winControls" hidden>
      <button class="wc wc-close" id="wcClose" title="关闭" aria-label="关闭"></button>
      <button class="wc wc-min" id="wcMin" title="最小化" aria-label="最小化"></button>
      <button class="wc wc-max" id="wcMax" title="最大化" aria-label="最大化"></button>
    </div>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2 20 20"/>
          <path d="M8 10.5h5M10.5 8v5" opacity=".55"/>
        </svg>
      </span>
      <span class="brand-name">LumenScope</span>
      <span class="brand-by">by 只因君</span>
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="brand-device" id="deviceTitle">未连接</span>
    </div>

    <div class="topbar-stats" id="topbarStats">
      <span class="stat" title="渲染帧率"><b id="statFps">—</b><i>FPS</i></span>
      <span class="stat" title="每帧 GPU 提交耗时"><b id="statMs">—</b><i>ms</i></span>
      <span class="stat" data-optional title="原生采集分辨率"><b id="statNative">—</b><i>原生</i></span>
      <span class="stat" data-optional title="输出分辨率"><b id="statOut">—</b><i>输出</i></span>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="btnSnapshot" title="拍照  ⌘S" disabled>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8.5A2 2 0 0 1 6 6.5h1.6l1-1.6h6.8l1 1.6H18a2 2 0 0 1 2 2v7A2 2 0 0 1 18 17.5H6a2 2 0 0 1-2-2z"/>
          <circle cx="12" cy="12" r="3.1"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnRecord" title="录制  ⌘R" disabled>
        <span class="rec-dot" aria-hidden="true"></span>
      </button>
      <button class="icon-btn" id="btnFullscreen" title="全屏  F11">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnPanel" title="控制面板" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h10"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 主体：画面 + 侧边控制 -->
  <main class="stage" id="stage">
    <section class="viewport" id="viewport">
      <canvas id="glcanvas"></canvas>

      <!-- 未连接 / 搜索中 / 错误 三态 -->
      <div class="viewport-overlay" id="overlay" data-state="idle">
        <div class="ov-idle" id="ovIdle">
          <div class="ov-ring" aria-hidden="true"><span></span></div>
          <h1 class="ov-title">连接你的显微镜</h1>
          <p class="ov-sub">插上 USB 摄像头后，在「设备」里选择它即可开始实时成像。</p>
          <div class="device-list" id="deviceList" role="list"></div>
          <button class="text-btn" id="btnRediscover">重新搜索设备</button>
        </div>

        <div class="ov-busy" id="ovBusy" hidden>
          <div class="busy-bar"><span></span></div>
          <p>正在唤醒 <b id="busyName">USB CAMERA</b>…</p>
        </div>

        <div class="ov-error" id="ovError" hidden>
          <h2 id="errTitle">无法打开摄像头</h2>
          <p id="errBody">设备可能被其他程序占用（如相机 App、微信视频）。关闭后可重试。</p>
          <div class="ov-error-actions">
            <button class="pill-btn primary" id="btnRetry">重试</button>
            <button class="pill-btn" id="btnChooseOther">换设备</button>
          </div>
        </div>
        <p class="ov-credit">LumenScope · 作者 只因君 · 禁止商用 / 禁止二改</p>
      </div>

      <!-- 悬浮工具栏 -->
      <div class="zoom-ctl" id="zoomCtl" hidden>
        <button class="zc-btn" id="zoomOut" title="缩小（−）" aria-label="缩小">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg>
        </button>
        <button class="zc-val" id="zoomVal" title="复位到 100%（0）">
          <span id="zoomPct">1.0×</span>
        </button>
        <button class="zc-btn" id="zoomIn" title="放大（+）" aria-label="放大">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
        </button>
      </div>
      <div class="glass-bar" id="glassBar" hidden>
        <button class="seg" data-res="720">720p</button>
        <button class="seg" data-res="1080">1080p</button>
        <button class="seg" data-res="1440">2K</button>
        <span class="glass-sep" aria-hidden="true"></span>
        <button class="seg fps-seg" data-fps="30">30</button>
        <button class="seg fps-seg" data-fps="60">60</button>
        <span class="glass-sep" aria-hidden="true"></span>
        <button class="toggle-chip" id="chipSuper" data-on="true" title="超分辨率 EASU">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v4M12 16v4M4 12h4M16 12h4"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg>
          <span>超分</span>
        </button>
        <button class="toggle-chip" id="chipAntiShake" data-on="true" title="电子防抖">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 6 6v5.5c0 4 2.6 7.3 6 9 3.4-1.7 6-5 6-9V6z"/></svg>
          <span>防抖</span>
        </button>
        <button class="toggle-chip" id="chipJelly" data-on="true" title="防果冻（卷帘快门校正）">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9c2.7 0 2.7 3 5.3 3S12 9 14.7 9s2.7 3 5.3 3"/><path d="M4 15c2.7 0 2.7 3 5.3 3s2.7-3 5.4-3 2.7 3 5.3 3"/></svg>
          <span>防果冻</span>
        </button>
        <button class="toggle-chip" id="chipDenoise" data-on="true" title="时域降噪">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h.01M9 8h.01M9 16h.01M13 11h.01M16 7h.01M16 15h.01M19 12h.01"/></svg>
          <span>降噪</span>
        </button>
      </div>

      <div class="toast-stack" id="toasts" aria-live="polite"></div>
      <div class="rec-badge" id="recBadge" hidden><span></span>REC <b id="recTime">00:00</b></div>
    </section>

    <!-- 侧边控制面板 -->
    <aside class="panel" id="panel" data-open="true">
      <div class="panel-inner">
        <div class="panel-group">
          <div class="group-head">
            <h3>输出</h3>
            <span class="group-meta" id="resMeta">原生 720p → 1080p</span>
          </div>
          <div class="res-cards" id="resCards">
            <button class="res-card" data-res="720">
              <b>720p</b><i>原生</i>
            </button>
            <button class="res-card is-active" data-res="1080">
              <b>1080p</b><i>推荐</i>
            </button>
            <button class="res-card" data-res="1440">
              <b>2K</b><i>极限</i>
            </button>
          </div>
          <div class="row seg-row">
            <span class="row-label">帧率</span>
            <div class="seg-group" id="fpsGroup">
              <button class="seg-pill is-active" data-fps="30">30 fps</button>
              <button class="seg-pill" data-fps="60">60 fps</button>
            </div>
          </div>
          <div class="row seg-row">
            <span class="row-label" title="Lanczos-3 保留更多细节，FSR 更省一点 GPU">超分引擎</span>
            <div class="seg-group" id="engineGroup">
              <button class="seg-pill is-active" data-engine="lanczos">精细</button>
              <button class="seg-pill" data-engine="easu">极速</button>
            </div>
          </div>
        </div>

        <div class="panel-group">
          <div class="group-head"><h3>输出设备</h3><span class="group-meta" id="vcamMeta">未启动</span></div>
          <button class="vcam-btn" id="btnVcam" data-state="off">
            <span class="vcam-ico">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="6.5" width="12.5" height="11" rx="2.2"/><path d="M15.5 11.2l4.2-2.3v6.2l-4.2-2.3"/>
              </svg>
            </span>
            <span class="vcam-txt">
              <b id="vcamLabel">作为虚拟摄像头输出</b>
              <i id="vcamHint">把处理后的画面给会议/直播软件</i>
            </span>
            <span class="vcam-state" aria-hidden="true"></span>
          </button>
        </div>

        <div class="panel-group">
          <div class="group-head"><h3>稳像</h3><span class="group-meta" id="motionMeta">静止</span></div>
          <label class="row">
            <span class="row-label">防抖强度</span>
            <input type="range" min="0" max="100" value="80" id="slStrength">
            <output id="outStrength">80</output>
          </label>
          <label class="row">
            <span class="row-label">裁剪余量</span>
            <input type="range" min="0" max="20" value="7" id="slCrop">
            <output id="outCrop">7%</output>
          </label>
        </div>

        <div class="panel-group">
          <div class="group-head"><h3>画质</h3></div>
          <label class="row">
            <span class="row-label">降噪</span>
            <input type="range" min="0" max="100" value="55" id="slDenoise">
            <output id="outDenoise">55</output>
          </label>
          <label class="row">
            <span class="row-label">锐度</span>
            <input type="range" min="0" max="200" value="35" id="slSharpen">
            <output id="outSharpen">0.35</output>
          </label>
          <label class="row switch-row">
            <span class="row-label">自动亮度</span>
            <input type="checkbox" id="ckAutoExposure" class="switch" checked>
          </label>
          <label class="row">
            <span class="row-label">曝光</span>
            <input type="range" min="30" max="260" value="100" id="slExposure">
            <output id="outExposure">1.00×</output>
          </label>
          <label class="row">
            <span class="row-label">对比度</span>
            <input type="range" min="70" max="170" value="100" id="slContrast">
            <output id="outContrast">100</output>
          </label>
        </div>

        <div class="panel-group">
          <div class="group-head"><h3>设备</h3></div>
          <div class="device-select-wrap">
            <select id="cameraSelect" class="select"></select>
          </div>
          <label class="row switch-row">
            <span class="row-label">自动白平衡</span>
            <input type="checkbox" id="ckAwb" class="switch" checked>
          </label>
          <button class="save-btn" id="btnReveal">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l1.4-2h3.2L15 6h4a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
            <span id="saveLabel">打开下载目录</span>
          </button>
        </div>

        <div class="panel-foot">
          <p class="author-line">LumenScope · 作者 <b>只因君</b></p>
          <p class="license-line">禁止商用 · 禁止二改</p>
        </div>
      </div>
    </aside>
  </main>
</div>

<script src="/src/core/gl.js"></script>
<script src="/src/core/shader/fsr.glsl.js"></script>
<script src="/src/core/shader/lanczos.glsl.js"></script>
<script src="/src/core/shader/temporal.glsl.js"></script>
<script src="/src/core/shader/meter.glsl.js"></script>
<script src="/src/core/motion.js"></script>
<script src="/src/core/pipeline.js"></script>
<script src="/src/core/vcam.js"></script>
<script src="/src/app.js"></script>
</body>
</html>
